<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1724">
  <title>Torque A Controller</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TEMPORARY TEST INTERFACE: not the official Torque Team website. -->
  <main class="app">

    <header class="head">
      <h1>TORQUE A</h1>
      <p>Temporary test controller</p>
    </header>

    <!-- ===== Connection ===== -->
    <section class="card" aria-label="Connection">
      <form id="connectForm" autocomplete="off" novalidate>
        <label for="ip">IP address</label>
        <input id="ip" type="text" inputmode="decimal" value="192.168.4.1"
               spellcheck="false" autocapitalize="off" autocorrect="off">

        <label for="password">Password</label>
        <div class="pw">
          <input id="password" type="password" autocomplete="off"
                 spellcheck="false" autocapitalize="off" autocorrect="off">
          <button type="button" id="togglePw" class="ghost" aria-pressed="false">Show</button>
        </div>
        <p class="note">
          Not sent anywhere. The robot firmware has no login, so join the
          <strong>Torque_A</strong> Wi-Fi in your device's Wi-Fi settings instead.
        </p>

        <div class="row">
          <button type="submit" id="connectBtn" class="primary">Connect</button>
          <span class="status" id="status" data-state="disconnected">
            <span class="dot" aria-hidden="true"></span>
            <span id="statusText">Disconnected</span>
          </span>
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <!-- ===== Movement ===== -->
    <section class="card" aria-label="Movement controls">
      <div class="pad" id="pad">
        <button type="button" class="dir pad-f" data-move="F" aria-label="Forward" disabled>&uarr;</button>
        <button type="button" class="dir pad-l" data-move="L" aria-label="Left" disabled>&larr;</button>
        <button type="button" class="stop pad-s" id="stopBtn" aria-label="Stop" disabled>STOP</button>
        <button type="button" class="dir pad-r" data-move="R" aria-label="Right" disabled>&rarr;</button>
        <button type="button" class="dir pad-b" data-move="B" aria-label="Backward" disabled>&darr;</button>
      </div>
      <p class="note center">Hold to move, release to stop. Keys: arrows / WASD, Space = STOP.</p>
    </section>

    <!-- ===== Speed ===== -->
    <section class="card" aria-label="Speed control">
      <label for="speed">Speed (PWM)</label>
      <div class="speed">
        <input id="speed" type="range" min="0" max="1023" step="1" value="400" disabled>
        <output id="speedValue" for="speed">400</output>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
